<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Certificate application (uploads)</title>
    <style>
      body { font: 15px system-ui; max-width: 560px; margin: 32px auto; }
      .row { margin-top: 18px; }
      .error { color: #b00020; display: block; }
      .dz { margin-top: 8px; padding: 24px; border: 2px dashed #999; text-align: center; }
      .hidden-input { display: none; }
    </style>
  </head>
  <body>
    <form onsubmit="return false">
      <h2>Certificate application</h2>

      <!-- 1. A plain file input, with the site's own size check (like most government forms). -->
      <div class="row">
        <label for="photo">Applicant photo *</label>
        <input id="photo" name="photo" type="file" accept=".jpg,.jpeg" required />
        <small>JPG only, below 50 KB</small>
        <span id="photo-error" class="error"></span>
      </div>

      <!-- 2. Hidden input behind a styled button, and a separate Upload button (JSF / PrimeFaces style). -->
      <div class="row upload">
        <span>Community certificate</span>
        <button type="button" id="cert-pick">Choose file</button>
        <input id="cert" name="cert" type="file" accept="application/pdf" class="hidden-input" />
        <small>PDF, max 1 MB</small>
        <button type="button" id="cert-upload">Upload</button>
        <span id="cert-status"></span>
      </div>

      <!-- 3. A drop zone with its hidden input inside (react-dropzone style). -->
      <div class="row">
        <span>Signature</span>
        <div class="dz" id="dz">Drag and drop your signature here, or click to browse
          <input id="sign" name="sign" type="file" accept="image/*" hidden />
        </div>
      </div>
    </form>
    <pre id="state-echo" data-vff-ignore=""></pre>
    <script>
      const echo = {};
      const show = () => (document.getElementById('state-echo').textContent = JSON.stringify(echo));
      const record = (key, input) => {
        const f = input.files && input.files[0];
        echo[key] = f ? { name: f.name, size: f.size, type: f.type } : null;
        show();
      };

      const photo = document.getElementById('photo');
      photo.addEventListener('change', () => {
        const f = photo.files[0];
        const err = document.getElementById('photo-error');
        // The site's own check: too big → message and the file is taken out.
        if (f && f.size > 50 * 1024) {
          err.textContent = 'File size must be below 50 KB';
          photo.value = '';
        } else err.textContent = '';
        record('photo', photo);
      });

      const cert = document.getElementById('cert');
      document.getElementById('cert-pick').addEventListener('click', () => cert.click());
      cert.addEventListener('change', () => record('cert', cert));
      document.getElementById('cert-upload').addEventListener('click', () => {
        document.getElementById('cert-status').textContent = cert.files.length ? 'Uploaded ' + cert.files[0].name : 'Choose a file first';
        echo.cert_uploaded = !!cert.files.length;
        show();
      });

      const sign = document.getElementById('sign');
      const dz = document.getElementById('dz');
      dz.addEventListener('click', () => sign.click());
      dz.addEventListener('dragover', (e) => e.preventDefault());
      dz.addEventListener('drop', (e) => {
        e.preventDefault();
        echo.sign = { name: e.dataTransfer.files[0].name, size: e.dataTransfer.files[0].size, via: 'drop' };
        show();
      });
      sign.addEventListener('change', () => record('sign', sign));
      show();
    </script>
  </body>
</html>
