<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scholarship application (bank details)</title>
    <style>
      body { font: 15px system-ui; max-width: 560px; margin: 32px auto; }
      label { display: block; margin-top: 12px; }
    </style>
  </head>
  <body>
    <!-- Page 3 of the multi-step form: a new page on the same site (full navigation). -->
    <form onsubmit="return false">
      <h2>Scholarship application: bank details</h2>
      <label for="bank_name">Bank name</label>
      <input id="bank_name" name="bank_name" />
      <label for="ifsc">IFSC code</label>
      <input id="ifsc" name="ifsc" />
      <label for="account_no">Account number</label>
      <input id="account_no" name="account_no" />
    </form>
  </body>
</html>
