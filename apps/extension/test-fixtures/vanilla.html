<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Customer onboarding</title>
    <style>
      body { font: 15px system-ui; max-width: 560px; margin: 32px auto; }
      label, legend { display: block; margin-top: 12px; }
      input:not([type=radio]):not([type=checkbox]), select, textarea { width: 100%; padding: 6px; box-sizing: border-box; }
      .inline label { display: inline; margin-right: 12px; }
    </style>
  </head>
  <body>
    <form id="form">
      <h2>Customer onboarding</h2>
      <label for="full_name">Full name *</label>
      <input id="full_name" name="full_name" required />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />
      <label for="phone">Mobile number</label>
      <input id="phone" name="phone" type="tel" />
      <label for="age">Age</label>
      <input id="age" name="age" type="number" min="18" max="100" />
      <label for="dob">Date of birth</label>
      <input id="dob" name="dob" type="date" />
      <label for="state">State</label>
      <select id="state" name="state">
        <option value="">Select state</option>
        <option value="TN">Tamil Nadu</option>
        <option value="KL">Kerala</option>
        <option value="KA">Karnataka</option>
      </select>
      <fieldset class="inline">
        <legend>Gender</legend>
        <label><input type="radio" name="gender" value="m" /> Male</label>
        <label><input type="radio" name="gender" value="f" /> Female</label>
        <label><input type="radio" name="gender" value="o" /> Other</label>
      </fieldset>
      <fieldset class="inline">
        <legend>Contact me by</legend>
        <label><input type="checkbox" name="contact" value="sms" /> SMS</label>
        <label><input type="checkbox" name="contact" value="email" /> Email</label>
      </fieldset>
      <label><input type="checkbox" id="terms" name="terms" /> I agree to the terms</label>
      <label for="address">Address</label>
      <textarea id="address" name="address" rows="3"></textarea>
      <input type="hidden" name="csrf_token" value="abc" />
      <p><button type="submit">Submit</button></p>
    </form>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
